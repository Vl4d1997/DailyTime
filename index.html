<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Табель</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#14202b;--muted:#64748b;--line:#e2e8f0;--in:#0f9d58;--out:#e8710a;--accent:#0f766e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1419;--card:#18212a;--text:#e8eef3;--muted:#8fa1b0;--line:#2a3640}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:20px 16px 8px;max-width:560px;margin:0 auto}
h1{margin:0;font-size:26px}
#today-label{color:var(--muted);text-transform:capitalize}
#today-line{margin-top:2px;font-size:14px}
main{padding:8px 16px 40px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
button{font-family:inherit}

/* кнопки отметки */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{border:0;border-radius:14px;padding:22px 8px;font-size:22px;font-weight:700;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px}
.big small{font-size:12px;font-weight:400;opacity:.9}
.big.in{background:var(--in)}
.big.out{background:var(--out)}
.big:active{transform:scale(.98)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;margin-top:6px}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:7px 4px}

/* статистика */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:13px}

/* календарь */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead button{background:var(--bg);border:0;color:var(--text);width:42px;height:42px;border-radius:12px;font-size:22px}
#cal-title{flex:1;min-width:0;white-space:nowrap;text-align:center;font-size:18px;font-weight:600;background:none;border:0;color:var(--text);padding:8px 4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cell{height:48px;border:0;border-radius:10px;background:transparent;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;padding:0}
.cell.blank{pointer-events:none;visibility:hidden}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.sel{background:var(--accent);color:#fff}
.dots{display:flex;gap:3px;height:7px;margin-top:3px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.di{background:var(--in)}
.dot.do{background:var(--out)}
.cell.sel .dot{box-shadow:0 0 0 1.5px #fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend .dot{display:inline-block;margin-right:4px}

/* день */
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:600;text-transform:capitalize}
.badge{background:var(--accent);color:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;text-transform:none;white-space:nowrap}
.addrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.addrow button{background:var(--bg);border:0;color:var(--text);border-radius:10px;padding:10px;font-size:14px}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mark{border:1px solid var(--line);border-radius:12px;padding:8px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.mhead b.in{color:var(--in)}
.mhead b.out{color:var(--out)}
.time{font-size:20px;font-weight:600}
.photo{display:block;width:100%;height:150px;object-fit:cover;border-radius:8px;background:var(--line)}
.noimg{display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.mact{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.mact button{background:var(--bg);border:0;color:var(--text);border-radius:8px;padding:8px 4px;font-size:13px}
.mact button.del{color:#d93025}
.mact button.acc{color:var(--accent);font-weight:600}
.empty{color:var(--muted);text-align:center;padding:14px 4px;font-size:14px;grid-column:1/-1}

/* окна */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:11;padding:24px}
.overlay[hidden]{display:none}
.box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px}
.box h3{margin:0 0 12px;font-size:18px}
.box label{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
.box input,.box select{display:block;width:100%;margin-top:4px;padding:11px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-family:inherit}
.box .row{display:flex;gap:10px;margin-top:14px}
.box .row button{flex:1;padding:12px;border-radius:10px;border:0;font-size:16px;background:var(--line);color:var(--text)}
.box .row button.primary{background:var(--accent);color:#fff}
.box .row button.danger{background:#d93025;color:#fff}
.box .killbtn{display:block;margin:12px auto 0;background:none;border:0;color:#d93025;font-size:14px;padding:6px}
#viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:10}
#viewer[hidden]{display:none}
#viewer img{max-width:100%;max-height:calc(100% - 90px)}
#viewer .vbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));justify-content:center}
#viewer .vbar button{flex:1;max-width:180px;border:0;border-radius:12px;padding:14px 8px;font-size:16px;font-weight:600;background:#fff;color:#14202b}
#viewer .vbar button.acc{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:12;max-width:90%;text-align:center}
#toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Табель</h1>
  <div id="today-label"></div>
  <div id="today-line"></div>
</header>

<main>
  <section class="card">
    <div class="btns">
      <button class="big in" id="btn-in">Приход<small>снять на камеру</small></button>
      <button class="big out" id="btn-out">Уход<small>снять на камеру</small></button>
    </div>
    <div class="links">
      <button class="link" id="gal-in">Приход из галереи</button>
      <button class="link" id="gal-out">Уход из галереи</button>
      <button class="link" id="nophoto-in">Приход без снимка</button>
      <button class="link" id="nophoto-out">Уход без снимка</button>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="card">
    <div class="calhead">
      <button id="prev" aria-label="Прошлый месяц">‹</button>
      <button id="cal-title"></button>
      <button id="next" aria-label="Следующий месяц">›</button>
    </div>
    <div class="grid" id="cal-grid"></div>
    <div class="legend">
      <span><span class="dot di"></span>приход</span>
      <span><span class="dot do"></span>уход</span>
    </div>
  </section>

  <section class="card">
    <div class="dayhead" id="day-head"></div>
    <div class="addrow">
      <button id="add-in">+ Приход в этот день</button>
      <button id="add-out">+ Уход в этот день</button>
    </div>
    <div class="marks" id="day-marks"></div>
  </section>
</main>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>

<div id="viewer" hidden><img alt=""><div class="vbar"><button class="acc" id="v-share">Поделиться</button><button id="v-save">Сохранить</button><button id="v-close">Закрыть</button></div></div>

<div id="modal" class="overlay" hidden>
  <div class="box">
    <div id="modal-text"></div>
    <div class="row">
      <button id="no">Отмена</button>
      <button id="yes" class="danger">Удалить</button>
    </div>
  </div>
</div>

<div id="edit" class="overlay" hidden>
  <div class="box">
    <h3>Изменить отметку</h3>
    <label>Тип
      <select id="e-type">
        <option value="in">Приход</option>
        <option value="out">Уход</option>
      </select>
    </label>
    <label>Дата
      <input type="date" id="e-date">
    </label>
    <label>Время
      <input type="time" id="e-time">
    </label>
    <div class="row">
      <button id="e-cancel">Отмена</button>
      <button id="e-save" class="primary">Сохранить</button>
    </div>
    <button class="killbtn" id="e-del">Удалить отметку</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function () {
  var DB_NAME = 'tabel', STORE = 'marks';
  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return String(n).padStart(2, '0'); };

  var urls = [];
  var allCache = [];
  var byDay = {};
  var pending = null;     // {type, day}
  var editId = null;
  var now0 = new Date();
  var view = new Date(now0.getFullYear(), now0.getMonth(), 1);
  var selected = dayKey(now0);

  /* ---------- хранилище (IndexedDB, только на телефоне) ---------- */
  function openDB() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = function () {
        var s = r.result.createObjectStore(STORE, { keyPath: 'id', autoIncrement: true });
        s.createIndex('date', 'date');
      };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function run(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction(STORE, mode);
        var rq = fn(t.objectStore(STORE));
        t.oncomplete = function () { res(rq ? rq.result : undefined); };
        t.onerror = function () { rej(t.error); };
        t.onabort = function () { rej(t.error); };
      });
    });
  }
  var dbAll = function () { return run('readonly', function (s) { return s.getAll(); }); };
  var dbAdd = function (rec) { return run('readwrite', function (s) { return s.add(rec); }); };
  var dbPut = function (rec) { return run('readwrite', function (s) { return s.put(rec); }); };
  var dbDel = function (id) { return run('readwrite', function (s) { return s.delete(id); }); };

  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) {}
  }

  /* ---------- вспомогательные ---------- */
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function fromKey(k) { var p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmtTime(ts) { var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function fmtDay(d) { return d.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }); }
  function fmtDur(ms) {
    var m = Math.round(ms / 60000);
    return Math.floor(m / 60) + ' ч ' + pad(m % 60) + ' м';
  }
  function label(type) { return type === 'in' ? 'Приход' : 'Уход'; }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function findMark(id) {
    for (var i = 0; i < allCache.length; i++) if (allCache[i].id === id) return allCache[i];
    return null;
  }
  var toastTimer;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2300);
  }
  function ask(text) {
    return new Promise(function (res) {
      $('modal-text').textContent = text;
      $('modal').hidden = false;
      $('yes').onclick = function () { $('modal').hidden = true; res(true); };
      $('no').onclick = function () { $('modal').hidden = true; res(false); };
    });
  }
  var viewMark = null;
  function openViewer(src, m) {
    viewMark = m;
    $('viewer').querySelector('img').src = src;
    $('viewer').hidden = false;
  }
  $('viewer').onclick = function (e) { if (e.target === this || e.target.tagName === 'IMG') $('viewer').hidden = true; };
  $('v-close').onclick = function () { $('viewer').hidden = true; };
  $('v-share').onclick = function () { if (viewMark) sharePhoto(viewMark); };
  $('v-save').onclick = function () { if (viewMark && saveToPhone(viewMark)) toast('Сохранено в загрузки'); };

  function dayWork(list) {
    var ins = [], outs = [];
    list.forEach(function (m) { (m.type === 'in' ? ins : outs).push(m.ts); });
    if (!ins.length || !outs.length) return null;
    var d = Math.max.apply(null, outs) - Math.min.apply(null, ins);
    return d > 0 ? d : null;
  }

  /* ---------- файл снимка: сохранить в телефон / поделиться ---------- */
  function fileName(m) {
    var d = new Date(m.ts);
    return 'Tabel_' + dayKey(d) + '_' + pad(d.getHours()) + '-' + pad(d.getMinutes()) + '_' + m.type + '.jpg';
  }
  function saveToPhone(m) {
    try {
      var u = URL.createObjectURL(m.photo);
      var a = document.createElement('a');
      a.href = u;
      a.download = fileName(m);
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
      return true;
    } catch (e) { return false; }
  }
  function sharePhoto(m) {
    var f;
    try { f = new File([m.photo], fileName(m), { type: 'image/jpeg' }); } catch (e) { f = null; }
    if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
      navigator.share({ files: [f], title: label(m.type) + ' ' + fmtTime(m.ts) })
        .catch(function (e) { if (e && e.name !== 'AbortError') toast('Не удалось поделиться'); });
    } else {
      toast('Поделиться недоступно здесь, снимок сохранён в загрузки');
      saveToPhone(m);
    }
  }

  /* ---------- сжатие снимка ---------- */
  function shrink(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var k = Math.min(1, 1280 / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        c.toBlob(function (b) { b ? res(b) : rej(new Error('blob')); }, 'image/jpeg', 0.8);
      };
      img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('img')); };
      img.src = url;
    });
  }

  /* ---------- добавление отметки ---------- */
  // day = null → сейчас; day = 'YYYY-MM-DD' → в выбранный день, потом откроется правка времени
  function addMark(type, file, day, autoSave) {
    var p = file ? shrink(file) : Promise.resolve(null);
    return p.then(function (photo) {
      var now = new Date();
      var target = now;
      if (day) {
        var d = fromKey(day);
        target = new Date(d.getFullYear(), d.getMonth(), d.getDate(), now.getHours(), now.getMinutes(), 0);
      }
      var rec = { type: type, ts: target.getTime(), date: dayKey(target), photo: photo };
      return dbAdd(rec).then(function (id) {
        var saved = autoSave && photo ? saveToPhone(rec) : false;
        selected = rec.date;
        view = new Date(target.getFullYear(), target.getMonth(), 1);
        return render().then(function () {
          if (day) { openEdit(id); toast('Проверьте дату и время'); }
          else toast(label(type) + ' записан в ' + fmtTime(rec.ts) + (saved ? ', снимок сохранён в загрузки' : ''));
        });
      });
    }).catch(function () { toast('Не удалось сохранить, попробуйте ещё раз'); });
  }

  function pick(type, day, inputId) {
    pending = { type: type, day: day, cam: inputId === 'cam' };
    var f = $(inputId);
    f.value = '';
    f.click();
  }
  function onFile() {
    var f = this.files && this.files[0];
    if (f && pending) {
      var p = pending;
      pending = null;
      addMark(p.type, f, p.day, p.cam);
    }
  }
  $('cam').onchange = onFile;
  $('gal').onchange = onFile;

  $('btn-in').onclick = function () { pick('in', null, 'cam'); };
  $('btn-out').onclick = function () { pick('out', null, 'cam'); };
  $('gal-in').onclick = function () { pick('in', null, 'gal'); };
  $('gal-out').onclick = function () { pick('out', null, 'gal'); };
  $('nophoto-in').onclick = function () { addMark('in', null, null); };
  $('nophoto-out').onclick = function () { addMark('out', null, null); };
  $('add-in').onclick = function () { pick('in', selected, 'gal'); };
  $('add-out').onclick = function () { pick('out', selected, 'gal'); };

  /* ---------- изменение отметки ---------- */
  function openEdit(id) {
    var m = findMark(id);
    if (!m) return;
    editId = id;
    var d = new Date(m.ts);
    $('e-type').value = m.type;
    $('e-date').value = dayKey(d);
    $('e-time').value = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('edit').hidden = false;
  }
  $('e-cancel').onclick = function () { $('edit').hidden = true; };
  $('e-save').onclick = function () {
    var m = findMark(editId);
    var dv = $('e-date').value, tv = $('e-time').value;
    if (!m || !dv || !tv) { toast('Укажите дату и время'); return; }
    var dp = dv.split('-'), tp = tv.split(':');
    var t = new Date(+dp[0], +dp[1] - 1, +dp[2], +tp[0], +tp[1], 0);
    if (isNaN(t.getTime())) { toast('Неверная дата или время'); return; }
    m.type = $('e-type').value;
    m.ts = t.getTime();
    m.date = dayKey(t);
    dbPut(m).then(function () {
      $('edit').hidden = true;
      selected = m.date;
      view = new Date(t.getFullYear(), t.getMonth(), 1);
      return render();
    }).then(function () { toast('Сохранено'); })
      .catch(function () { toast('Не удалось сохранить'); });
  };
  $('e-del').onclick = function () {
    var m = findMark(editId);
    if (!m) return;
    $('edit').hidden = true;
    ask('Удалить отметку «' + label(m.type) + '» в ' + fmtTime(m.ts) + '?').then(function (ok) {
      if (ok) dbDel(m.id).then(render);
      else $('edit').hidden = false;
    });
  };

  /* ---------- отрисовка ---------- */
  function renderCalendar() {
    var MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    var y = view.getFullYear(), mo = view.getMonth();
    $('cal-title').textContent = MONTHS[mo] + ' ' + y + 'г';
    var grid = $('cal-grid');
    grid.innerHTML = '';
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(function (n) { grid.appendChild(el('div', 'wd', n)); });
    var offset = (new Date(y, mo, 1).getDay() + 6) % 7;
    for (var i = 0; i < offset; i++) grid.appendChild(el('div', 'cell blank'));
    var total = new Date(y, mo + 1, 0).getDate();
    var todayKey = dayKey(new Date());
    for (var d = 1; d <= total; d++) grid.appendChild(makeCell(y + '-' + pad(mo + 1) + '-' + pad(d), d, todayKey));
  }
  function makeCell(key, d, todayKey) {
    var list = byDay[key] || [];
    var hasIn = list.some(function (m) { return m.type === 'in'; });
    var hasOut = list.some(function (m) { return m.type === 'out'; });
    var cls = 'cell' + (key === todayKey ? ' today' : '') + (key === selected ? ' sel' : '');
    var b = el('button', cls,
      '<span>' + d + '</span><span class="dots">' +
      (hasIn ? '<span class="dot di"></span>' : '') +
      (hasOut ? '<span class="dot do"></span>' : '') + '</span>');
    b.onclick = function () { selected = key; draw(); };
    return b;
  }

  function markCard(m) {
    var c = el('div', 'mark');
    c.appendChild(el('div', 'mhead', '<b class="' + m.type + '">' + label(m.type) + '</b><span class="time">' + fmtTime(m.ts) + '</span>'));
    if (m.photo) {
      var img = el('img', 'photo');
      var u = URL.createObjectURL(m.photo);
      urls.push(u);
      img.src = u;
      img.alt = 'снимок';
      img.onclick = function () { openViewer(u, m); };
      c.appendChild(img);
    } else {
      c.appendChild(el('div', 'photo noimg', 'нет снимка'));
    }
    var act = el('div', 'mact');
    var e = el('button', '', 'Изменить');
    e.onclick = function () { openEdit(m.id); };
    var x = el('button', 'del', 'Удалить');
    x.onclick = function () {
      ask('Удалить отметку «' + label(m.type) + '» в ' + fmtTime(m.ts) + '?')
        .then(function (ok) { if (ok) dbDel(m.id).then(render); });
    };
    act.appendChild(e);
    act.appendChild(x);
    if (m.photo) {
      var sh = el('button', 'acc', 'Поделиться');
      sh.onclick = function () { sharePhoto(m); };
      var sv = el('button', '', 'Сохранить');
      sv.onclick = function () { if (saveToPhone(m)) toast('Сохранено в загрузки'); };
      act.appendChild(sh);
      act.appendChild(sv);
    }
    c.appendChild(act);
    return c;
  }

  function renderDay() {
    var list = byDay[selected] || [];
    var w = dayWork(list);
    $('day-head').innerHTML = '<span>' + fmtDay(fromKey(selected)) + '</span>' +
      (w ? '<span class="badge">' + fmtDur(w) + '</span>' : '');
    var box = $('day-marks');
    box.innerHTML = '';
    if (!list.length) box.appendChild(el('div', 'empty', 'В этот день отметок нет'));
    list.forEach(function (m) { box.appendChild(markCard(m)); });
  }

  function renderStats() {
    var prefix = view.getFullYear() + '-' + pad(view.getMonth() + 1) + '-';
    var days = 0, total = 0;
    Object.keys(byDay).forEach(function (k) {
      if (k.indexOf(prefix) === 0) { days++; total += dayWork(byDay[k]) || 0; }
    });
    $('stats').innerHTML =
      '<div class="stat"><b>' + days + '</b><span>дней с отметками</span></div>' +
      '<div class="stat"><b>' + fmtDur(total) + '</b><span>отработано за месяц</span></div>';
  }

  function renderToday() {
    var n = new Date();
    $('today-label').textContent = fmtDay(n);
    var list = byDay[dayKey(n)] || [];
    var ins = list.filter(function (m) { return m.type === 'in'; });
    var outs = list.filter(function (m) { return m.type === 'out'; });
    var parts = [];
    if (ins.length) parts.push('приход ' + fmtTime(ins[0].ts));
    if (outs.length) parts.push('уход ' + fmtTime(outs[outs.length - 1].ts));
    $('today-line').textContent = parts.length ? 'Сегодня: ' + parts.join(' · ') : 'Сегодня отметок пока нет';
  }

  function draw() {
    renderToday();
    renderStats();
    renderCalendar();
    renderDay();
  }

  function render() {
    return dbAll().then(function (all) {
      urls.forEach(function (u) { URL.revokeObjectURL(u); });
      urls = [];
      allCache = all;
      byDay = {};
      all.forEach(function (m) { (byDay[m.date] = byDay[m.date] || []).push(m); });
      Object.keys(byDay).forEach(function (k) { byDay[k].sort(function (a, b) { return a.ts - b.ts; }); });
      draw();
    }).catch(function () {
      toast('Хранилище недоступно. Проверьте разрешения приложения');
    });
  }

  /* ---------- навигация по месяцам ---------- */
  $('prev').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() - 1, 1); draw(); };
  $('next').onclick = function () { view = new Date(view.getFullYear(), view.getMonth() + 1, 1); draw(); };
  $('cal-title').onclick = function () {
    var n = new Date();
    view = new Date(n.getFullYear(), n.getMonth(), 1);
    selected = dayKey(n);
    draw();
  };

  render();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) render(); });
})();
</script>
</body>
</html>
